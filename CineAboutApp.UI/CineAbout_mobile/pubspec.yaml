name: cineabout_mobile
description: "CineAbout mobile application for film lovers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  go_router: ^18.1.3
  dio: ^5.8.0+1
  flutter_secure_storage: ^11.2.0
  jwt_decoder: ^2.0.1
  intl: ^0.20.2
  image_picker: ^1.2.4
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
